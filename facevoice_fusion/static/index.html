<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FaceVoice Fusion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e12;
        --panel: rgba(19, 23, 30, 0.78);
        --panel-border: rgba(255, 255, 255, 0.08);
        --panel-glow: rgba(62, 220, 255, 0.18);
        --text: #e7edf3;
        --muted: rgba(231, 237, 243, 0.6);
        --accent: #33e3ff;
        --accent-strong: #ffb454;
        --success: #45f7b3;
        --warning: #ff8f5a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        background: radial-gradient(circle at top, rgba(41, 51, 64, 0.6), transparent 55%),
          linear-gradient(120deg, rgba(10, 12, 17, 0.9), rgba(6, 7, 10, 0.98)),
          #040506;
        color: var(--text);
        min-height: 100vh;
      }

      .app {
        padding: 32px 48px 48px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .upload {
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(8, 12, 16, 0.9);
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--panel-border);
      }

      .file-input {
        color: var(--muted);
        font-size: 13px;
      }

      .btn {
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s ease;
      }

      .btn.primary {
        background: linear-gradient(135deg, rgba(51, 227, 255, 0.18), rgba(51, 227, 255, 0.05));
        border-color: rgba(51, 227, 255, 0.4);
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .date {
        text-align: right;
        font-size: 14px;
        color: var(--muted);
      }

      .status {
        color: var(--accent);
        font-size: 14px;
        margin-top: 8px;
      }

      .main-grid {
        display: grid;
        grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border-radius: 20px;
        border: 1px solid var(--panel-border);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(20px);
        position: relative;
      }

      .panel::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        box-shadow: 0 0 50px var(--panel-glow);
        opacity: 0.3;
      }

      .video-panel {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .video-wrap {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(51, 227, 255, 0.2);
        background: #0d1118;
      }

      video {
        width: 100%;
        display: block;
        border-radius: 18px;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      .badge-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .badge {
        background: rgba(51, 227, 255, 0.1);
        border: 1px solid rgba(51, 227, 255, 0.35);
        color: var(--accent);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
      }

      .badge.secondary {
        color: var(--accent-strong);
        border-color: rgba(255, 180, 84, 0.5);
        background: rgba(255, 180, 84, 0.1);
      }

      .side-panel {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .panel-block {
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 16px;
        background: rgba(9, 12, 18, 0.7);
      }

      .panel-block h3 {
        margin: 0 0 12px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .summary-grid {
        display: grid;
        gap: 10px;
        font-size: 13px;
      }

      .summary-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
      }

      .summary-item strong {
        color: var(--accent-strong);
      }

      .list {
        display: grid;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
        padding-left: 0;
        margin: 0;
      }

      .list li {
        list-style: none;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
      }

      .activity-panel {
        padding: 24px;
        display: grid;
        gap: 12px;
      }

      .section-title {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .log {
        background: rgba(7, 9, 13, 0.85);
        padding: 16px;
        border-radius: 14px;
        height: 200px;
        overflow: auto;
        font-size: 12px;
        color: var(--muted);
        white-space: pre-line;
      }

      .tracks {
        display: grid;
        gap: 10px;
        font-size: 13px;
      }

      .track-card {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
      }

      @media (max-width: 1100px) {
        .main-grid,
        .activity-panel {
          grid-template-columns: 1fr;
        }

        .controls {
          flex-direction: column;
          align-items: flex-end;
        }

        .app {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top-bar">
        <div class="brand">
          <h1>FaceVoice Fusion</h1>
          <p>Speaker diarization, face tracking, identity matching, and emotion cues</p>
        </div>
        <div class="controls">
          <div>
            <div class="upload">
              <input class="file-input" type="file" id="fileInput" accept="video/*,.mxf,.mfx,.avi,.mov,.mkv,.wmv" />
              <button id="uploadBtn" class="btn primary">Analyze</button>
            </div>
            <div class="status" id="status"></div>
          </div>
          <div class="date" id="dateStamp"></div>
        </div>
      </header>

      <section class="main-grid">
        <div class="panel video-panel">
          <div class="badge-row">
            <div class="badge">Face Tracks: <span id="trackCount">0</span></div>
            <div class="badge secondary">Speaker Segments: <span id="speakerCount">0</span></div>
          </div>
          <div class="video-wrap">
            <video id="video" controls></video>
            <canvas id="overlay"></canvas>
          </div>
        </div>
        <aside class="panel side-panel">
          <div class="panel-block">
            <h3>Pipeline Summary</h3>
            <div class="summary-grid" id="summaryGrid"></div>
          </div>
          <div class="panel-block">
            <h3>Identities &amp; Emotions</h3>
            <div class="tracks" id="tracks"></div>
          </div>
          <div class="panel-block">
            <h3>Speaker Segments</h3>
            <ul class="list" id="speakerList"></ul>
          </div>
          <div class="panel-block">
            <h3>Speaker ↔ Face Links</h3>
            <ul class="list" id="associationList"></ul>
          </div>
        </aside>
      </section>

      <section class="panel activity-panel">
        <div class="section-title">Processing Timeline</div>
        <div class="log" id="log"></div>
      </section>
    </div>

    <script>
      const uploadBtn = document.getElementById('uploadBtn');
      const fileInput = document.getElementById('fileInput');
      const log = document.getElementById('log');
      const tracksDiv = document.getElementById('tracks');
      const status = document.getElementById('status');
      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');
      const overlayCtx = overlay.getContext('2d');
      const trackCount = document.getElementById('trackCount');
      const speakerCount = document.getElementById('speakerCount');
      const summaryGrid = document.getElementById('summaryGrid');
      const speakerList = document.getElementById('speakerList');
      const associationList = document.getElementById('associationList');
      const dateStamp = document.getElementById('dateStamp');
      let uiData = null;
      let animationId = null;
      const trackState = {};
      let speakerState = [];
      let associationState = [];
      let currentJobId = null;
      let previewRetryCount = 0;
      const maxPreviewRetries = 12;
      let currentEventSource = null;

      function formatDate(date) {
        return date.toLocaleDateString('en-US', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric',
        });
      }

      dateStamp.textContent = formatDate(new Date());

      function appendLog(msg) {
        log.innerText += msg + '\n';
        log.scrollTop = log.scrollHeight;
      }

      function getBestAssociation(trackId) {
        if (!Array.isArray(associationState)) {
          return null;
        }
        const matches = associationState.filter((assoc) => assoc.track_id === trackId);
        if (!matches.length) {
          return null;
        }
        return matches.sort((a, b) => (b.confidence || 0) - (a.confidence || 0))[0];
      }

      function renderTrack(track) {
        const current = trackState[track.track_id] || {};
        const merged = {
          ...current,
          ...track,
          identity: { ...(current.identity || {}), ...(track.identity || {}) },
          emotion: { ...(current.emotion || {}), ...(track.emotion || {}) },
        };
        if (Array.isArray(merged.bboxes)) {
          merged.bboxes.sort((a, b) => a.t - b.t);
        }
        trackState[track.track_id] = merged;
        const existing = document.getElementById(track.track_id);
        const emotion = merged.emotion || {};
        const dominantLabelValue = emotion.dominant || 'neutral';
        const dominantConf = Array.isArray(emotion.timeline)
          ? Math.max(0, ...emotion.timeline.map((entry) => entry.conf || 0))
          : 0;
        const confLabel = dominantConf ? ` (${Math.round(dominantConf * 100)}%)` : '';
        const association = getBestAssociation(merged.track_id);
        const speakerLabel = association?.speaker_id || 'S?';
        const identityLabel = merged.identity?.name || 'Unknown';
        const text = `${merged.track_id} · ${speakerLabel} · ${identityLabel} · ${dominantLabelValue}${confLabel}`;
        if (existing) {
          existing.innerText = text;
          refreshPanels();
          return;
        }
        const div = document.createElement('div');
        div.id = merged.track_id;
        div.className = 'track-card';
        div.innerText = text;
        tracksDiv.appendChild(div);
        refreshPanels();
      }

      function setCanvasSize() {
        if (!video.videoWidth || !video.videoHeight) {
          return;
        }
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
        overlay.style.width = `${video.clientWidth}px`;
        overlay.style.height = `${video.clientHeight}px`;
      }

      function findBoxAtTime(bboxes, time) {
        if (!Array.isArray(bboxes) || !bboxes.length) {
          return null;
        }
        let previous = null;
        for (const box of bboxes) {
          if (box.t <= time) {
            previous = box;
            continue;
          }
          if (!previous) {
            return box;
          }
          const duration = box.t - previous.t;
          if (duration <= 0) {
            return previous;
          }
          const ratio = Math.min(1, Math.max(0, (time - previous.t) / duration));
          return {
            x: previous.x + (box.x - previous.x) * ratio,
            y: previous.y + (box.y - previous.y) * ratio,
            w: previous.w + (box.w - previous.w) * ratio,
            h: previous.h + (box.h - previous.h) * ratio,
          };
        }
        return previous;
      }

      function getRenderableTracks() {
        const tracks = Object.values(trackState);
        if (tracks.length) {
          return tracks;
        }
        return uiData?.tracks || [];
      }

      function findEmotionAtTime(timeline, time) {
        if (!Array.isArray(timeline)) {
          return null;
        }
        for (const entry of timeline) {
          if (entry.start <= time && time <= entry.end) {
            return entry;
          }
        }
        return timeline.length ? timeline[timeline.length - 1] : null;
      }

      function drawOverlay() {
        if ((!uiData && !Object.keys(trackState).length) || !video.videoWidth || !video.videoHeight) {
          overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
          return;
        }
        const currentTime = video.currentTime;
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        overlayCtx.lineWidth = 2.5;
        overlayCtx.strokeStyle = '#33e3ff';
        overlayCtx.font = '16px Inter, Arial';
        overlayCtx.textBaseline = 'bottom';
        for (const track of getRenderableTracks()) {
          const bboxes = track.bboxes || [];
          const startTime = typeof track.start === 'number' ? track.start : bboxes[0]?.t ?? 0;
          const endTime =
            typeof track.end === 'number' ? track.end : bboxes[bboxes.length - 1]?.t ?? 0;
          if (currentTime < startTime || currentTime > endTime) {
            continue;
          }
          const box = findBoxAtTime(bboxes, currentTime);
          if (!box) {
            continue;
          }
          overlayCtx.strokeRect(box.x, box.y, box.w, box.h);
          const identityLabel = track.identity?.name || track.track_id;
          const emotionEntry = findEmotionAtTime(track.emotion?.timeline, currentTime);
          const emotionLabel = emotionEntry?.label || track.emotion?.dominant || 'neutral';
          const emotionConf = emotionEntry?.conf || 0;
          const confLabel = emotionConf ? ` (${Math.round(emotionConf * 100)}%)` : '';
          const label = `${identityLabel} • ${emotionLabel}${confLabel}`;
          const textWidth = overlayCtx.measureText(label).width;
          const labelX = Math.max(0, box.x);
          const labelY = Math.max(18, box.y - 6);
          overlayCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          overlayCtx.fillRect(labelX - 2, labelY - 18, textWidth + 6, 20);
          overlayCtx.fillStyle = '#33e3ff';
          overlayCtx.fillText(label, labelX + 1, labelY - 2);
        }
      }

      function startRenderLoop() {
        if (animationId) {
          return;
        }
        const render = () => {
          drawOverlay();
          animationId = requestAnimationFrame(render);
        };
        render();
      }

      function stopRenderLoop() {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
      }

      function resetJobState() {
        uiData = null;
        currentJobId = null;
        previewRetryCount = 0;
        stopRenderLoop();
        Object.keys(trackState).forEach((key) => delete trackState[key]);
        speakerState = [];
        associationState = [];
        tracksDiv.innerHTML = '';
        speakerList.innerHTML = '';
        associationList.innerHTML = '';
        summaryGrid.innerHTML = '';
        trackCount.textContent = '0';
        speakerCount.textContent = '0';
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      }

      function loadVideo(jobId) {
        currentJobId = jobId;
        const cacheBust = Date.now();
        video.src = `/jobs/${jobId}/video?ts=${cacheBust}`;
        video.load();
      }

      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function renderSpeakers(speakers) {
        speakerList.innerHTML = '';
        if (!speakers.length) {
          const item = document.createElement('li');
          item.textContent = 'No speaker segments yet.';
          speakerList.appendChild(item);
          return;
        }
        speakers
          .slice()
          .sort((a, b) => (a.start || 0) - (b.start || 0))
          .forEach((segment) => {
            const item = document.createElement('li');
            const confLabel = segment.conf ? `${Math.round(segment.conf * 100)}%` : '—';
            item.textContent = `${segment.speaker_id} · ${formatTime(segment.start)}–${formatTime(
              segment.end,
            )} · conf ${confLabel}`;
            speakerList.appendChild(item);
          });
      }

      function renderAssociations(associations, tracks) {
        associationList.innerHTML = '';
        if (!associations.length) {
          const item = document.createElement('li');
          item.textContent = 'No speaker ↔ face associations yet.';
          associationList.appendChild(item);
          return;
        }
        associations.forEach((assoc) => {
          const item = document.createElement('li');
          const track = tracks.find((entry) => entry.track_id === assoc.track_id);
          const identityLabel = track?.identity?.name || 'Unknown';
          const confLabel = assoc.confidence ? `${Math.round(assoc.confidence * 100)}%` : '—';
          item.textContent = `${assoc.speaker_id} → ${assoc.track_id} (${identityLabel}) · ${confLabel}`;
          associationList.appendChild(item);
        });
      }

      function updateSummary(tracks, speakers, associations) {
        const identityNames = new Set(
          tracks.map((track) => track.identity?.name).filter((name) => name && name !== 'Unknown'),
        );
        const tracksWithEmotion = tracks.filter(
          (track) => track.emotion?.dominant || (track.emotion?.timeline || []).length,
        );
        summaryGrid.innerHTML = '';
        const items = [
          { label: 'Face tracks', value: tracks.length },
          { label: 'Speaker segments', value: speakers.length },
          { label: 'Identities matched', value: identityNames.size },
          { label: 'Emotion tracks', value: tracksWithEmotion.length },
          { label: 'Associations', value: associations.length },
        ];
        items.forEach((entry) => {
          const item = document.createElement('div');
          item.className = 'summary-item';
          item.innerHTML = `<span>${entry.label}</span><strong>${entry.value}</strong>`;
          summaryGrid.appendChild(item);
        });
        trackCount.textContent = tracks.length;
        speakerCount.textContent = speakers.length;
      }

      function refreshPanels() {
        const tracks = getRenderableTracks();
        updateSummary(tracks, speakerState, associationState);
        renderSpeakers(speakerState);
        renderAssociations(associationState, tracks);
      }

      refreshPanels();

      async function loadUi(jobId) {
        const resp = await fetch(`/jobs/${jobId}/ui`);
        uiData = await resp.json();
        speakerState = uiData.speakers || [];
        associationState = uiData.associations || [];
        for (const track of uiData.tracks || []) {
          if (Array.isArray(track.bboxes)) {
            track.bboxes.sort((a, b) => a.t - b.t);
          }
          renderTrack(track);
        }
        refreshPanels();
        loadVideo(jobId);
        drawOverlay();
      }

      video.addEventListener('loadedmetadata', () => {
        previewRetryCount = 0;
        setCanvasSize();
        drawOverlay();
      });
      video.addEventListener('error', () => {
        if (!currentJobId || previewRetryCount >= maxPreviewRetries) {
          return;
        }
        previewRetryCount += 1;
        const retryDelay = 2000;
        status.innerText = 'Preparing a preview format for this video...';
        setTimeout(() => loadVideo(currentJobId), retryDelay);
      });
      video.addEventListener('play', startRenderLoop);
      video.addEventListener('pause', () => {
        stopRenderLoop();
        drawOverlay();
      });
      video.addEventListener('seeked', drawOverlay);
      window.addEventListener('resize', () => {
        setCanvasSize();
        drawOverlay();
      });

      uploadBtn.onclick = async () => {
        const file = fileInput.files[0];
        if (!file) {
          alert('Select a video');
          return;
        }
        uploadBtn.disabled = true;
        status.innerText = 'Uploading...';
        if (currentEventSource) {
          currentEventSource.close();
          currentEventSource = null;
        }
        resetJobState();
        log.innerText = '';
        const formData = new FormData();
        formData.append('file', file);
        try {
          const resp = await fetch('/upload', { method: 'POST', body: formData });
          if (!resp.ok) {
            const errorText = await resp.text();
            throw new Error(errorText || `Upload failed with status ${resp.status}`);
          }
          const data = await resp.json();
          status.innerText = `Job ${data.job_id} queued`;
          appendLog(`Job ${data.job_id} queued`);
          loadVideo(data.job_id);

          const evtSource = new EventSource(`/jobs/${data.job_id}/events`);
          currentEventSource = evtSource;
          evtSource.addEventListener('job.progress', (event) => {
            appendLog(`Progress: ${event.data}`);
          });
          evtSource.addEventListener('track.created', (event) => {
            const payload = JSON.parse(event.data);
            renderTrack(payload.track);
          });
          evtSource.addEventListener('track.identity', (event) => {
            const payload = JSON.parse(event.data);
            renderTrack({ track_id: payload.track_id, identity: payload.identity });
          });
          evtSource.addEventListener('track.emotion', (event) => {
            const payload = JSON.parse(event.data);
            renderTrack({ track_id: payload.track_id, emotion: payload.emotion_update });
          });
          evtSource.addEventListener('speaker.segment', (event) => {
            const payload = JSON.parse(event.data);
            speakerState = [...speakerState, payload.segment];
            refreshPanels();
          });
          evtSource.addEventListener('association.updated', (event) => {
            const payload = JSON.parse(event.data);
            const association = payload.association;
            associationState = associationState.filter(
              (entry) =>
                !(entry.track_id === association.track_id && entry.speaker_id === association.speaker_id),
            );
            associationState.push(association);
            refreshPanels();
          });
          evtSource.addEventListener('job.done', (event) => {
            appendLog(`Done: ${event.data}`);
            status.innerHTML = `Done. <a href="/jobs/${data.job_id}/ui" target="_blank">View ui.json</a>`;
            loadUi(data.job_id);
            evtSource.close();
            if (currentEventSource === evtSource) {
              currentEventSource = null;
            }
          });
          evtSource.addEventListener('job.failed', (event) => {
            appendLog(`Failed: ${event.data}`);
            status.innerText = 'Job failed. Check logs for details.';
            evtSource.close();
            if (currentEventSource === evtSource) {
              currentEventSource = null;
            }
          });
          evtSource.addEventListener('error', () => {
            if (currentEventSource === evtSource) {
              status.innerText = 'Connection lost. Please try again.';
              currentEventSource = null;
            }
          });
        } catch (error) {
          status.innerText = 'Upload failed. Please try again.';
          appendLog(`Upload failed: ${error.message}`);
        } finally {
          uploadBtn.disabled = false;
        }
      };
    </script>
  </body>
</html>
